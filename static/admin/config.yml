# Sveltia CMS: article management. Articles are Markdown files committed to this repo.
backend:
  name: github
  repo: phil-the-dev/phil-the-dev-site
  branch: main

media_folder: static/images/articles
public_folder: /images/articles

collections:
  - name: articles
    label: Articles
    label_singular: Article
    folder: src/content/articles
    create: true
    extension: md
    format: frontmatter
    slug: '{{slug}}'
    summary: '{{title}} · {{date}}'
    sortable_fields: [date, title]
    fields:
      - { name: title, label: Title, widget: string }
      - { name: date, label: Date, widget: datetime, time_format: false, date_format: YYYY-MM-DD, format: YYYY-MM-DD }
      - { name: description, label: Description, widget: text, required: false }
      - { name: draft, label: Draft, widget: boolean, default: true }
      - { name: body, label: Body, widget: markdown }
